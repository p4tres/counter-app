<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CounterApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <app-counter
    heading="Nové počítadlo"
    (saved)="onSaved($event)"
  ></app-counter>

  <ion-toast
    [isOpen]="toastMessage() !== null"
    [message]="toastMessage() ?? ''"
    [duration]="2000"
    position="top"
    color="success"
    (didDismiss)="toastMessage.set(null)"
  ></ion-toast>
</ion-content>
